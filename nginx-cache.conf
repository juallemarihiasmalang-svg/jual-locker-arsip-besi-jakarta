# Nginx cache policy — sisipkan ke dalam blok server { ... }
# Memperbaiki audit PageSpeed: "Serve static assets with an efficient cache policy"

# Aset statis: cache 1 tahun immutable
location ~* \.(css|js|webp|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# HTML: selalu revalidate
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

location / {
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# Kompresi
gzip on;
gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml;
gzip_min_length 1024;
